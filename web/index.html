<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Phones (the Android app): lay the DAW out at tablet width and let the screen scale it down.
    if (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 700) {
      document.querySelector('meta[name=viewport]').content = 'width=1180';
    }
  </script>
  <title>BasicDAW</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- icon sprite (stroke icons, 24x24) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-skip-back" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16z"/><path d="M5 19V5"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-metronome" viewBox="0 0 24 24"><path d="M8.5 3h7l4 18h-15l4-18z"/><path d="M12 15 17 6"/><path d="M7 16h10"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m4 4 7.07 17 2.51-7.39L21 11.07 4 4z"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/><path d="m5 8 4 4M12 15l4 4"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M10 13h4"/></symbol>
    <symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v10M13 3v10M18 3v10M8 13v8M13 13v8"/><path d="M7 3h2v10H7zM12 3h2v10h-2zM17 3h2v10h-2z" fill="currentColor"/></symbol>
    <symbol id="i-drum" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="9" ry="3.5"/><path d="M3 9v6c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5V9"/><path d="m16 2-3.5 7M8 2l3.5 7"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h2M6 8v8M10 4v16M14 7v10M18 10v4M22 12h-2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="i-midi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="7.5" cy="12" r="1" fill="currentColor"/><circle cx="16.5" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="8" r="1" fill="currentColor"/><circle cx="15" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="6.5" r="1" fill="currentColor"/><path d="M10 18h4"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M12 13v8l-3-3m3 3 3-3"/><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-file-music" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="10" cy="16" r="2"/><path d="M12 16v-5l3 1"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></symbol>
    <symbol id="i-follow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/><path d="M3 4v16"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M9 10h.01M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></symbol>
    <symbol id="i-quantize" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="13" width="3" height="5" rx=".5"/><rect x="12" y="9" width="3" height="9" rx=".5"/><rect x="17" y="5" width="3" height="13" rx=".5"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11h6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  </svg>

  <div id="app">
    <header class="topbar">
      <div class="brand" title="BasicDAW">
        <img src="img/logo.svg" alt="" class="brand-logo">
        <span class="brand-name">BasicDAW</span>
      </div>

      <div class="tb-group">
        <button class="btn ghost" id="btn-projects" title="Projects (Ctrl+O)">
          <svg class="ic"><use href="#i-folder"/></svg><span>Projects</span><svg class="ic sm"><use href="#i-chevron"/></svg>
        </button>
        <div class="project-title">
          <input id="project-name" spellcheck="false" autocomplete="off" aria-label="Project name">
          <span id="dirty-dot" class="dirty-dot" title="Unsaved changes"></span>
        </div>
        <button class="icon-btn" id="btn-save" title="Save (Ctrl+S)"><svg class="ic"><use href="#i-save"/></svg></button>
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)"><svg class="ic"><use href="#i-undo"/></svg></button>
        <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)"><svg class="ic"><use href="#i-redo"/></svg></button>
      </div>

      <div class="transport">
        <button class="icon-btn" id="btn-home" title="Back to start (Home)"><svg class="ic"><use href="#i-skip-back"/></svg></button>
        <button class="play-btn" id="btn-play" title="Play / Pause (Space)">
          <svg class="ic ic-play"><use href="#i-play"/></svg><svg class="ic ic-pause"><use href="#i-pause"/></svg>
        </button>
        <button class="icon-btn" id="btn-stop" title="Stop (Enter)"><svg class="ic"><use href="#i-stop"/></svg></button>
        <button class="icon-btn rec-btn" id="btn-record" title="Record armed tracks (R)"><svg class="ic"><use href="#i-record"/></svg></button>
        <button class="icon-btn toggle" id="btn-loop" title="Loop (L) - drag on the arranger ruler to set the region"><svg class="ic"><use href="#i-loop"/></svg></button>
        <button class="icon-btn toggle" id="btn-metronome" title="Metronome (C)"><svg class="ic"><use href="#i-metronome"/></svg></button>
        <div class="lcd" title="Position: bar . beat . sixteenth">
          <div class="lcd-pos" id="lcd-pos">1.1.1</div>
          <div class="lcd-time" id="lcd-time">00:00.000</div>
        </div>
        <label class="field" title="Tempo (BPM)"><span>BPM</span><input id="bpm" type="number" min="20" max="400" step="1"></label>
        <label class="field" title="Time signature"><span>SIG</span>
          <select id="timesig">
            <option value="4/4">4/4</option><option value="3/4">3/4</option><option value="2/4">2/4</option>
            <option value="5/4">5/4</option><option value="6/8">6/8</option><option value="7/8">7/8</option><option value="12/8">12/8</option>
          </select>
        </label>
      </div>

      <div class="tb-group right">
        <canvas id="viz" class="viz" width="280" height="80" title="Master output"></canvas>
        <div class="pills">
          <span class="pill" id="pill-midi" title="MIDI bridge"><i></i>MIDI</span>
          <span class="pill" id="pill-midinous" title="Midinous"><i></i>Midinous</span>
        </div>
        <button class="icon-btn toggle" id="btn-keys" title="Play notes with your computer keyboard (K on, Esc off) - A W S E D F T G Y H U J K, Z/X octave"><svg class="ic"><use href="#i-keyboard"/></svg></button>
        <label class="master" title="Master volume"><svg class="ic"><use href="#i-volume"/></svg><input type="range" id="master-vol" min="0" max="1" step="0.01"></label>
        <button class="btn primary" id="btn-export"><svg class="ic"><use href="#i-download"/></svg><span>Export</span></button>
        <button class="icon-btn toggle on" id="btn-panel" title="Show / hide the browser panel (B)"><svg class="ic"><use href="#i-panel"/></svg></button>
      </div>
    </header>

    <main class="workspace">
      <section class="center">
        <section class="arranger panel" id="arranger">
          <div class="track-col">
            <div class="track-col-head">
              <span class="label"><svg class="ic sm"><use href="#i-layers"/></svg>Tracks</span>
              <button class="btn tiny" id="btn-add-track" title="Add a track"><svg class="ic sm"><use href="#i-plus"/></svg>Add</button>
            </div>
            <div class="track-list" id="track-list"></div>
          </div>
          <div class="canvas-wrap" id="arr-wrap"></div>
        </section>

        <div class="splitter" id="splitter" title="Drag to resize"></div>

        <section class="editor panel" id="editor">
          <div class="editor-bar">
            <div class="editor-title" id="editor-title"><span class="swatch"></span><span class="name">No track</span><span class="sub"></span></div>
            <div class="seg" id="tool-seg" role="group" aria-label="Tools">
              <button data-tool="draw" title="Draw (1 or D) - click to add, drag to set length, right-click deletes"><svg class="ic"><use href="#i-pencil"/></svg></button>
              <button data-tool="select" title="Select (2 or V) - box-select, move, resize"><svg class="ic"><use href="#i-pointer"/></svg></button>
              <button data-tool="erase" title="Erase (3 or E)"><svg class="ic"><use href="#i-eraser"/></svg></button>
            </div>
            <label class="field compact" title="Grid / snap"><svg class="ic sm"><use href="#i-magnet"/></svg>
              <select id="snap"></select>
            </label>
            <label class="field compact" title="Length of new notes"><svg class="ic sm"><use href="#i-music"/></svg>
              <select id="note-len"></select>
            </label>
            <label class="field compact" title="Scale highlighting"><span>Key</span>
              <select id="key-root"></select><select id="key-scale"></select>
            </label>
            <label class="field compact" title="Velocity for new notes"><span>Vel</span>
              <input id="note-vel" type="number" min="1" max="127" step="1" value="100">
            </label>
            <div class="spacer"></div>
            <button class="icon-btn" id="btn-quantize" title="Quantize selection (Q)"><svg class="ic"><use href="#i-quantize"/></svg></button>
            <button class="icon-btn toggle on" id="btn-ghost" title="Show other tracks' notes"><svg class="ic"><use href="#i-ghost"/></svg></button>
            <button class="icon-btn toggle on" id="btn-follow" title="Follow playhead"><svg class="ic"><use href="#i-follow"/></svg></button>
            <button class="icon-btn" id="btn-zoom-out" title="Zoom out (Ctrl+wheel)"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
            <button class="icon-btn" id="btn-zoom-in" title="Zoom in (Ctrl+wheel)"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
          </div>
          <div class="canvas-wrap roll-wrap" id="roll-wrap"></div>
        </section>
      </section>

      <aside class="side panel" id="side">
        <nav class="tabs" id="side-tabs">
          <button data-tab="instruments" class="active"><svg class="ic sm"><use href="#i-piano"/></svg>Sounds</button>
          <button data-tab="track"><svg class="ic sm"><use href="#i-sliders"/></svg>Track</button>
          <button data-tab="midinous"><svg class="ic sm"><use href="#i-zap"/></svg>Midinous</button>
          <button data-tab="midi"><svg class="ic sm"><use href="#i-midi"/></svg>MIDI</button>
        </nav>
        <div class="tab-body" id="tab-instruments"></div>
        <div class="tab-body hidden" id="tab-track"></div>
        <div class="tab-body hidden" id="tab-midinous"></div>
        <div class="tab-body hidden" id="tab-midi"></div>
      </aside>
    </main>

    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-card">
        <svg class="ic xl"><use href="#i-upload"/></svg>
        <h2>Drop to import</h2>
        <p>MIDI songs (.mid) become editable tracks · audio files become audio tracks ·<br>BasicDAW projects and Midinous documents (.json) open directly</p>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="menu-root"></div>
    <div class="toasts" id="toasts"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
